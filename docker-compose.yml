services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cobuccio-php-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: sqlite
      # The database lives in a named volume: it survives container rebuilds and is not shared
      # with a local `php artisan serve` run, which uses database/database.sqlite.
      DB_DATABASE: /var/www/html/storage/database/database.sqlite
    volumes:
      - .:/var/www/html
      - sqlite_data:/var/www/html/storage/database
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - cobuccio-net

  web:
    image: nginx:1.27-alpine
    container_name: cobuccio-php-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cobuccio-net

networks:
  cobuccio-net:
    driver: bridge

volumes:
  sqlite_data:
