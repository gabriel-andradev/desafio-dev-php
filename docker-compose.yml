services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: cobuccio-php-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cobuccio-net

  web:
    image: nginx:1.27-alpine
    container_name: cobuccio-php-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - cobuccio-net

  db:
    image: mysql:8.0
    container_name: cobuccio-php-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cobuccio_wallet}
      MYSQL_USER: ${DB_USERNAME:-cobuccio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_dev_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_dev}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-root_local_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cobuccio-net

networks:
  cobuccio-net:
    driver: bridge

volumes:
  db_data:

